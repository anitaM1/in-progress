<!DOCTYPE html>
<html>

<head>
    <title>About - In Progress</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <button id="menuButton" onclick="toggleMenu()">☰</button>
    <span>My website</span>
</header>

<hr>

<nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="learning.html">Learning</a>
    <a href="projects.html">Projects</a>
    <a href="notes.html">Notes</a>

</nav>

<main>

    <section>
        <h1>About</h1>

        <p>
            I'm learning, exploring, and building my way through technology.
            This space is a record of what I'm discovering, creating,
            and improving along the way.
        </p>
    </section>

</main>

<script>
function toggleMenu() {
    const menu = document.querySelector("nav");
    const button = document.querySelector("#menuButton");

    if (menu.style.display === "flex") {
        menu.style.display = "none";
        button.textContent = "☰";
    } else {
        menu.style.display = "flex";
        button.textContent = "×";
    }
}

document.querySelectorAll("nav a").forEach(function(link) {
    link.addEventListener("click", function() {
        document.querySelector("nav").style.display = "none";
        document.querySelector("#menuButton").textContent = "☰";
    });
});
</script>

</body>
</html>
